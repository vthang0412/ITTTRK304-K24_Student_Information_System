# ============================================================
# Production profile (deploy/docker-compose.prod.yml)
# - Hibernate only validates the schema, it never changes it.
# - Demo data from data.sql is NEVER loaded.
# - Schema migrations are applied by Flyway (db/migration).
# - Swagger UI is disabled by default.
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

# Never seed demo accounts / demo data in production.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Flyway baseline:
# - empty database  -> V1..V7 create the schema from scratch;
# - existing schema -> baselined at version 6 (the last version before V7).
#   V2/V4/V5 are not idempotent, so a Hibernate-created database without
#   flyway_schema_history MUST skip them; V7 then reconciles the schema
#   idempotently and widens the grade columns. Do NOT lower this back to 1.
# See docs/DEPLOYMENT.md before enabling this on an existing database.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=6
spring.flyway.validate-on-migrate=true

# Fail fast in production: no insecure localhost/root/123456 fallback.
# Docker Compose always provides these variables from deploy/.env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

# Swagger / OpenAPI is disabled in production by default.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

# CORS: empty by default because the SPA is served same-origin by Nginx.
# Set APP_CORS_ALLOWED_ORIGINS to a comma-separated list only if a separate
# frontend origin must call the API directly. Never use "*".
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
