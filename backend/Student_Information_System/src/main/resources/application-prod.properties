# ============================================================
# Production profile (deploy/docker-compose.prod.yml)
# - Hibernate only validates the schema, it never changes it.
# - Demo data from data.sql is NEVER loaded.
# - Schema migrations are applied by Flyway (db/migration).
# - Swagger UI is disabled by default.
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

# Never seed demo accounts / demo data in production.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Flyway baseline:
# - empty database  -> V1__baseline_schema.sql creates the schema;
# - existing schema -> baselined at version 1 and left untouched.
# See docs/DEPLOYMENT.md before enabling this on an existing database.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Swagger / OpenAPI is disabled in production by default.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

# CORS: empty by default because the SPA is served same-origin by Nginx.
# Set APP_CORS_ALLOWED_ORIGINS to a comma-separated list only if a separate
# frontend origin must call the API directly. Never use "*".
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
