spring.application.name=Student_Information_System
server.port=${BACKEND_PORT:8080}

# Active profile. Production containers set SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:123456}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# JPA / HIBERNATE
# ddl-auto is defined per profile (dev=update, prod=validate).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=1MB

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-key-for-dev-only-please-change-in-prod}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ACTUATOR / HEALTH
# Only the health endpoint is exposed. Details stay hidden so the endpoint does
# not leak database names, hosts or exception messages.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# MAIL CONFIGURATION
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================================
# CẤU HÌNH GIỚI HẠN GỬI MÃ OTP (CHỐNG SPAM & BRUTE-FORCE)
# =========================================================================
# 1. Thời gian chờ (Cooldown) giữa 2 lần bấm gửi liên tiếp (tính bằng giây, mặc định: 60)
app.security.otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}

# 2. Số lần gửi mã OTP tối đa trong 1 giờ (mặc định: 5, bạn có thể chỉnh thành 10, 20, 100 tùy ý)
app.security.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
