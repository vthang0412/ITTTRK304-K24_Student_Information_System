spring.application.name=Student_Information_System
server.port=${BACKEND_PORT:8080}

# Active profile. Production containers set SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Thang@bn1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# JPA / HIBERNATE
# ddl-auto is defined per profile (dev=update, prod=validate).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=1MB

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-key-for-dev-only-please-change-in-prod}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ACTUATOR / HEALTH
# Only the health endpoint is exposed. Details stay hidden so the endpoint does
# not leak database names, hosts or exception messages.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
