spring.application.name=Student_Information_System
server.port=${BACKEND_PORT:8080}

# The runtime/deployment must select its profile explicitly.

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# JPA / HIBERNATE
# ddl-auto is defined per profile (dev=update, prod=validate).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=1MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ACTUATOR / HEALTH
# Only the health endpoint is exposed. Details stay hidden so the endpoint does
# not leak database names, hosts or exception messages.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# MAIL CONFIGURATION
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================================
# CẤU HÌNH GIỚI HẠN GỬI MÃ OTP (CHỐNG SPAM & BRUTE-FORCE)
# =========================================================================
# 1. Thời gian chờ (Cooldown) giữa 2 lần bấm gửi liên tiếp (tính bằng giây, mặc định: 60)
app.security.otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}

# 2. Số lần gửi mã OTP tối đa trong 1 giờ (mặc định: 5, bạn có thể chỉnh thành 10, 20, 100 tùy ý)
app.security.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
app.enrollment.max-credits-per-semester=${ENROLLMENT_MAX_CREDITS_PER_SEMESTER:24}

# =========================================================================
# CẤU HÌNH AI STUDENT ASSISTANT
# =========================================================================
# AI Provider Configuration
app.ai.provider=${AI_PROVIDER:both}

# Legacy OpenAI configuration
app.ai.model=${AI_MODEL:gemini-2.0-flash}
app.ai.openai.api-key=${OPENAI_API_KEY:}

# Gemini direct API
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.api-key=${GEMINI_API_KEY:}

# OpenRouter API
app.ai.openrouter.base-url=${OPEN_ROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.openrouter.model=${OPEN_ROUTER_MODEL:google/gemini-2.5-flash}
app.ai.openrouter.api-key=${OPEN_ROUTER_API_KEY:}

app.ai.rate-limit-per-hour=${AI_RATE_LIMIT_PER_HOUR:60}

# Phase 8 - output limits and continuation (safe defaults, hard-capped in code)
app.ai.output.max-tokens=${AI_OUTPUT_MAX_TOKENS:2048}
app.ai.output.max-length=${AI_OUTPUT_MAX_LENGTH:12000}
app.ai.request.timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:25}
app.ai.continuation.max-count=${AI_CONTINUATION_MAX_COUNT:3}
