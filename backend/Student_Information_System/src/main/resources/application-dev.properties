# DEVELOPMENT PROFILE

# Flyway is the only schema manager in every profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Development demo data
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false

# A clean local database is initialized by V1..Vn. Legacy databases must be
# backed up and explicitly migrated/reset before enabling baseline-on-migrate.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6
spring.flyway.validate-on-migrate=true

# Swagger
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}