# ============================================================
# Development profile (local + docker-compose.yml)
# - Hibernate may evolve the local schema.
# - Demo data in data.sql is loaded for convenience.
# - Swagger UI and localhost CORS are enabled.
# NEVER use this profile for production.
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Demo seed data (admin/123456, ...) is loaded only in development.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8

# Database migrations are managed by Hibernate in development.
spring.flyway.enabled=false

# Swagger / OpenAPI is available in development.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# CORS: localhost only by default. Override with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
