name: sis-prod

# Production stack for the SIS application.
# - Images come from GitHub Container Registry (GHCR), tagged by commit SHA.
# - MySQL and uploaded files use named volumes that must never be deleted on deploy.
# - MySQL is not published to the host; the frontend Nginx container is the only
#   published entry point and is bound to loopback for the host reverse proxy.
#
# Usage (on the VPS, with .env next to this file):
#   IMAGE_TAG=<commit-sha> \
#   BACKEND_IMAGE=ghcr.io/<owner>/<repo>-backend \
#   FRONTEND_IMAGE=ghcr.io/<owner>/<repo>-frontend \
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0.43
    container_name: sis-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sis_db}
      MYSQL_USER: ${DB_USERNAME:-sis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Verify the application database and user (not just the root server) so
      # the backend does not start during the first-run initialization window.
      # MYSQL_PWD keeps the password out of the process list.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    networks:
      - sis-network
    logging: *default-logging
    # No published ports: MySQL is reachable only on the private Docker network.

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: sis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-sis_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      DB_USERNAME: ${DB_USERNAME:-sis_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      # Demo seed data must never run in production.
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-never}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      # Mail & OTP configuration
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-60}
      OTP_MAX_REQUESTS_PER_HOUR: ${OTP_MAX_REQUESTS_PER_HOUR:-5}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      # Actuator health also checks the database connection, not just the port.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - sis-network
    logging: *default-logging
    # No published ports: the frontend Nginx proxies /api/, /uploads/,
    # /swagger-ui/ and /v3/api-docs/ to this container.

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: sis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only by default; host Nginx terminates TLS and proxies here.
      # Use FRONTEND_BIND_IP=0.0.0.0 only when no reverse proxy is available.
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sis-network
    logging: *default-logging

volumes:
  mysql_data:
    name: sis_mysql_data
  backend_uploads:
    name: sis_backend_uploads

networks:
  sis-network:
    name: sis-network
    driver: bridge
