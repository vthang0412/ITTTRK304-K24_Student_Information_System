# Temporary HTTP-only bootstrap configuration.
# Obtain a real certificate with Certbot, then install deploy/nginx/sis.conf.
server {
    listen 80;
    listen [::]:80;
    server_name sis.example.com;

    client_max_body_size 6M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
