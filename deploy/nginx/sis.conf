# Host-level reverse proxy for SIS.
#
# Install as /etc/nginx/sites-available/sis, replace sis.example.com with the
# real domain, enable it, then run certbot to add HTTPS:
#   sudo ln -s /etc/nginx/sites-available/sis /etc/nginx/sites-enabled/sis
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sis.example.com --redirect
#
# The frontend container is bound to 127.0.0.1:8080, so it is not reachable
# directly from the Internet; all traffic must pass through this proxy.

server {
    listen 80;
    listen [::]:80;
    server_name sis.example.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
