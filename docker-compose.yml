name: sis-dev

# Local development stack. The database volume is explicitly isolated from
# the production volume so both stacks can coexist safely.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0.43
    container_name: sis-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sis_db}
      MYSQL_USER: ${DB_USERNAME:-sis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required, copy .env.example to .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Loopback only: the dev database must not be reachable from the LAN.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Verify the application database and user (not just the root server) so
      # the backend does not start during the first-run initialization window.
      # MYSQL_PWD keeps the password out of the process list.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    networks:
      - sis-network
    logging: *default-logging

  backend:
    build:
      context: ./backend/Student_Information_System
      dockerfile: Dockerfile
    container_name: sis-dev-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-sis_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=CONVERT_TO_NULL
      DB_USERNAME: ${DB_USERNAME:-sis_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, copy .env.example to .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Only the isolated development database may load demo seed data.
      SPRING_SQL_INIT_MODE: always
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-60}
      OTP_MAX_REQUESTS_PER_HOUR: ${OTP_MAX_REQUESTS_PER_HOUR:-5}
      ENROLLMENT_MAX_CREDITS_PER_SEMESTER: ${ENROLLMENT_MAX_CREDITS_PER_SEMESTER:-24}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-60}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - sis-network
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    container_name: sis-dev-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sis-network
    logging: *default-logging

volumes:
  mysql_data:
    name: sis-dev-isolated-mysql-data
  backend_uploads:

networks:
  sis-network:
    driver: bridge
