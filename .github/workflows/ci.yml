name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/Student_Information_System
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: sis-ci-root-password
          MYSQL_DATABASE: sis_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    env:
      SIS_MYSQL_INTEGRATION: "true"
      SIS_MYSQL_ADMIN_URL: jdbc:mysql://127.0.0.1:3306/mysql
      SIS_MYSQL_ADMIN_USERNAME: root
      SIS_MYSQL_ADMIN_PASSWORD: sis-ci-root-password
      SIS_MYSQL_USERNAME: root
      SIS_MYSQL_PASSWORD: sis-ci-root-password

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/Student_Information_System/*.gradle
            backend/Student_Information_System/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

  frontend:
    name: Frontend (Node.js + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action v6
        with:
          context: ./backend/Student_Information_System
          file: ./backend/Student_Information_System/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=/
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

  config:
    name: Compose and scripts validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4

      - name: Validate workflow YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob
          import yaml
          for path in glob.glob(".github/workflows/*.yml"):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"OK {path}")
          PY

      - name: Validate shell scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/backup.sh
          bash -n deploy/rollback.sh
          bash -n deploy/restore.sh
          bash -n deploy/verify-backup.sh

      - name: Validate development compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          rm -f .env

      - name: Validate production compose file
        env:
          IMAGE_TAG: ci-validation
          BACKEND_IMAGE: example.invalid/sis-backend
          FRONTEND_IMAGE: example.invalid/sis-frontend
        run: |
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/env.production.example config --quiet
